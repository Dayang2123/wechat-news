{% extends "base.html" %}

{% block content %}
    <p>这里是已发布到微信公众号（或其他平台）的正式文章列表。</p>
    <!-- Add filters and table for published articles later -->
    <table>
        <thead>
            <tr>
                <th><input type="checkbox" id="select-all-published"></th>
                <th>文章标题</th>
                <th>发布平台</th>
                <th>发布日期</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- Example Row - Data will come from backend later -->
            <tr>
                <td><input type="checkbox" class="select-item-published"></td>
                <td>已发布的示例文章标题</td>
                <td>微信公众号</td>
                <td>2023-10-28</td>
                <td><span style="color: green;">发布成功</span></td>
                <td><a href="#">查看原文</a> | <a href="#">同步状态</a> | <a href="#">删除记录</a></td>
            </tr>
        </tbody>
    </table>
    <button>批量删除记录</button>
{% endblock %}
